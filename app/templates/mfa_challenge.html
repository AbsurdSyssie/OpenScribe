<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenScribe MFA</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v=20260701-token-harmonise">
  <link rel="stylesheet" href="/static/css/components.css?v=20260701-home-components">
  <link rel="stylesheet" href="/static/css/auth.css?v=20260701-auth-extract">
</head>
<body class="auth-page auth-page--mfa">
  <main>
    <section class="panel hero">
      <div class="eyebrow">Additional verification</div>
      <h1>Enter your TOTP code.</h1>
      <p>This login needs multi-factor verification before normal access is granted.</p>
      <div class="meta">Signed in as {{ current_user.email }}</div>
    </section>

    <section class="panel">
      {% if message %}
      <div class="flash">{{ message }}</div>
      {% endif %}

      <form method="post" action="/mfa/challenge">
        <label>
          6-digit TOTP code
          <input type="text" name="code" required minlength="6" maxlength="8" inputmode="numeric" autocomplete="one-time-code">
        </label>
        <label class="inline-check">
          <input type="checkbox" name="remember_device" value="true">
          <span>Remember this browser for 24 hours</span>
        </label>
        <div class="actions">
          <button type="submit">Verify and continue</button>
        </div>
      </form>

      <form method="post" action="/logout">
        <button class="secondary" type="submit">Sign out</button>
      </form>
    </section>
  <div class="toast-container" data-toast-container></div>
  <script nonce="{{ request.state.csp_nonce }}">
    (() => {
      const toastContainer = document.querySelector('[data-toast-container]');
      if (!toastContainer) return;
      document.querySelectorAll('.flash').forEach((flash) => {
        const message = flash.textContent.trim();
        if (!message) return;
        const toast = document.createElement('div');
        toast.className = 'toast error';
        toast.textContent = message;
        toastContainer.appendChild(toast);
        window.setTimeout(() => {
          toast.classList.add('hiding');
          window.setTimeout(() => toast.remove(), 200);
        }, 4000);
        flash.hidden = true;
      });
    })();
  </script>
  {% include "_csrf_script.html" %}
  </main>
</body>
</html>
