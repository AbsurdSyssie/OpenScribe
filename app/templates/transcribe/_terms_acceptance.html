<section class="scribe-terms-overlay" data-scribe-terms-overlay>
  <div class="scribe-terms-dialog" role="dialog" aria-modal="true" aria-labelledby="scribe-terms-title" aria-describedby="scribe-terms-intro" tabindex="-1" data-scribe-terms-dialog>
    <header class="scribe-terms-dialog__header">
      <h1 id="scribe-terms-title" tabindex="-1" data-scribe-terms-initial-focus>Terms of use</h1>
      <p id="scribe-terms-intro">Read these Terms before using the Scribe. Version {{ scribe_terms_version_no }}.</p>
    </header>
    <div class="scribe-terms-dialog__content" tabindex="0" aria-label="Terms of use content">
      {% set blocks = scribe_terms_blocks %}
      {% include "_legal_content_blocks.html" %}
    </div>
    <form class="scribe-terms-dialog__actions" method="post" action="/workspace/scribe-terms/accept">
      <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
      <input type="hidden" name="version_no" value="{{ scribe_terms_version_no }}">
      <div class="scribe-terms-dialog__buttons">
        <a class="btn-secondary" href="/workspace/preferences">I don’t accept</a>
        <button class="btn-primary" type="submit" name="accept_terms" value="yes">I’ve read and accept these terms</button>
      </div>
    </form>
  </div>
</section>
