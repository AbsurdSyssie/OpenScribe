name: openscribe

x-app-common: &app-common
  build:
    context: .
  image: openscribe:local
  env_file:
    - .env.docker
  environment:
    DATABASE_URL: postgresql+psycopg://ambient:${POSTGRES_PASSWORD:-ambient}@postgres:5432/ambient_scribe
    RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    VAULT_ADDR: http://vault:8200
    VAULT_TOKEN_FILE: /app/.local/vault/root-token
  restart: unless-stopped
  volumes:
    - vault_bootstrap:/app/.local/vault
  networks:
    - openscribe

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambient_scribe
      POSTGRES_USER: ambient
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambient}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambient -d ambient_scribe"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - openscribe

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - openscribe

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/local.hcl
    volumes:
      - ./docker/vault/local.hcl:/vault/config/local.hcl:ro
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - openscribe

  volume-init:
    <<: *app-common
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/.local/vault /app/.runtime"]
    restart: "no"
    volumes:
      - vault_bootstrap:/app/.local/vault
      - celerybeat_data:/app/.runtime

  vault-bootstrap:
    <<: *app-common
    command: ["vault-bootstrap"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/.local/vault/root-token && test -s /app/.local/vault/unseal-key"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app-common
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy

  web:
    <<: *app-common
    command: ["web"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-control:
    <<: *app-common
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ambient:${POSTGRES_PASSWORD:-ambient}@postgres:5432/ambient_scribe
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /app/.local/vault/root-token
      CELERY_QUEUE: control
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-generation:
    <<: *app-common
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ambient:${POSTGRES_PASSWORD:-ambient}@postgres:5432/ambient_scribe
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /app/.local/vault/root-token
      CELERY_QUEUE: generation
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-ingestion:
    <<: *app-common
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ambient:${POSTGRES_PASSWORD:-ambient}@postgres:5432/ambient_scribe
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /app/.local/vault/root-token
      CELERY_QUEUE: ingestion
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app-common
    command: ["beat"]
    volumes:
      - vault_bootstrap:/app/.local/vault
      - celerybeat_data:/app/.runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  vault_data:
  vault_bootstrap:
  celerybeat_data:

networks:
  openscribe:
