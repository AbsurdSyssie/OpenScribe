<div class="modal-shell {% if active_home_modal == 'personal-quick-action' %}is-open{% endif %}"><div class="panel modal-dialog"><div class="modal-header"><div><h2>Personal quick action</h2><p>Save reusable instruction.</p></div><a class="modal-close" href="/settings?tab=quick-actions" aria-label="Close">×</a></div><form method="post" action="/home/personal-quick-actions"><input type="hidden" name="quick_action_id" value="{{ personal_quick_action.id if personal_quick_action else '' }}"><input type="hidden" name="return_view" value="settings"><input type="hidden" name="return_tab" value="quick-actions"><input type="hidden" name="home_modal" value="personal-quick-action"><label>Quick action name<input name="name" maxlength="255" required value="{{ personal_quick_action.name if personal_quick_action else '' }}"></label><label>Description<input name="description" value="{{ personal_quick_action.description if personal_quick_action else '' }}"></label><label>Quick action text<textarea name="prompt_text" rows="8" required>{{ personal_quick_action_latest_version.prompt_text if personal_quick_action_latest_version else '' }}</textarea></label><label><input type="checkbox" name="is_active" value="true" {% if not personal_quick_action or personal_quick_action.is_active %}checked{% endif %}>Active</label><button class="btn-primary" type="submit">{{ 'Save personal quick action' if personal_quick_action else 'Create personal quick action' }}</button></form></div></div>
{% if is_manager %}<div class="modal-shell {% if active_home_modal == 'team-quick-action' %}is-open{% endif %}"><div class="panel modal-dialog"><div class="modal-header"><div><h2>Team quick action</h2><p>Save shared instruction.</p></div><a class="modal-close" href="/settings?tab=quick-actions" aria-label="Close">×</a></div><form method="post" action="/home/team-quick-actions"><input type="hidden" name="quick_action_id" value="{{ team_quick_action.id if team_quick_action else '' }}"><input type="hidden" name="return_view" value="settings"><input type="hidden" name="return_tab" value="quick-actions"><input type="hidden" name="home_modal" value="team-quick-action"><label>Quick action name<input name="name" maxlength="255" required value="{{ team_quick_action.name if team_quick_action else '' }}"></label><label>Description<input name="description" value="{{ team_quick_action.description if team_quick_action else '' }}"></label><label>Quick action text<textarea name="prompt_text" rows="8" required>{{ team_quick_action_latest_version.prompt_text if team_quick_action_latest_version else '' }}</textarea></label><label><input type="checkbox" name="is_active" value="true" {% if not team_quick_action or team_quick_action.is_active %}checked{% endif %}>Active</label><button class="btn-primary" type="submit">{{ 'Save team quick action' if team_quick_action else 'Create team quick action' }}</button></form></div></div>{% endif %}
