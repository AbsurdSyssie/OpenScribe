name: Docker runtime smoke test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - .env.example
      - start-dev.sh
      - README.md
      - docs/**
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - transcriber_changes/workspace/static/**
      - transcriber_changes/workspace/templates/**
      - .github/workflows/docker-smoke.yml
      - .github/scripts/**
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - .env.example
      - start-dev.sh
      - README.md
      - docs/**
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - transcriber_changes/workspace/static/**
      - transcriber_changes/workspace/templates/**
      - .github/workflows/docker-smoke.yml
      - .github/scripts/**

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate operational documentation links
        run: python .github/scripts/check-operational-docs.py

      - name: Validate cited scripts
        run: |
          bash -n start-dev.sh
          bash -n docker/entrypoint.sh
          bash -n scripts/test_file_ingestion.sh
          bash -n .github/scripts/wait-for-openscribe-health.sh
          python -m py_compile scripts/security/xss_probe.py .github/scripts/check-operational-docs.py

      - name: Create local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --profile runtime config --quiet

      - name: Build runtime image
        run: docker compose --profile runtime build --quiet

      - name: Start runtime
        run: docker compose --profile runtime up -d --no-build

      - name: Wait for OpenScribe health
        shell: bash
        run: bash .github/scripts/wait-for-openscribe-health.sh

      - name: Restart runtime on persistent volumes
        run: |
          docker compose --profile runtime down
          docker compose --profile runtime up -d --no-build

      - name: Wait for OpenScribe health after restart
        shell: bash
        run: bash .github/scripts/wait-for-openscribe-health.sh

      - name: Show final container status
        if: always()
        run: |
          docker compose --profile runtime ps -a
          docker compose --profile runtime logs --no-color --tail=100 openscribe || true

      - name: Stop runtime
        if: always()
        run: docker compose --profile runtime down --volumes
