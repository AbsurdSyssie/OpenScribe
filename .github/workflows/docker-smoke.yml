name: Docker runtime smoke test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - requirements-dev.txt
      - .env.example
      - start-dev.sh
      - README.md
      - docs/**
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - transcriber_changes/workspace/static/**
      - transcriber_changes/workspace/templates/**
      - .github/workflows/docker-smoke.yml
      - .github/scripts/**
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - requirements-dev.txt
      - .env.example
      - start-dev.sh
      - README.md
      - docs/**
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - transcriber_changes/workspace/static/**
      - transcriber_changes/workspace/templates/**
      - .github/workflows/docker-smoke.yml
      - .github/scripts/**

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate operational documentation links
        run: python .github/scripts/check-operational-docs.py

      - name: Validate cited scripts
        run: |
          bash -n start-dev.sh
          bash -n docker/entrypoint.sh
          bash -n scripts/test_file_ingestion.sh
          bash -n .github/scripts/wait-for-openscribe-health.sh
          python -m py_compile scripts/security/xss_probe.py .github/scripts/check-operational-docs.py

      - name: Validate Telehealth Python and browser module syntax
        run: |
          python -m py_compile app/models_telehealth.py app/services/telehealth_*.py app/schemas/telehealth.py tests/test_telehealth_*.py
          for module in app/static/js/transcribe/telehealth*.js; do
            node --input-type=module --check < "$module"
          done

      - name: Audit Python runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Create local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --profile runtime config --quiet

      - name: Build runtime image
        run: docker compose --profile runtime build --quiet

      - name: Start runtime
        run: docker compose --profile runtime up -d --no-build

      - name: Wait for OpenScribe health
        shell: bash
        run: bash .github/scripts/wait-for-openscribe-health.sh

      - name: Run focused Telehealth tests in isolated runtime infrastructure
        run: |
          # The runtime image contains pinned application dependencies. Add
          # pytest only in this ephemeral CI container; do not alter releases.
          docker compose cp tests openscribe:/app/tests
          docker compose exec -T -u root openscribe python -m pip install --quiet pytest==9.0.2 pytest-xdist==3.8.0
          docker compose exec -T \
            -e APP_ENV=test \
            -e TEST_DATABASE_URL=postgresql+psycopg://ambient:ambient@postgres:5432/ambient_scribe_test \
            -e TEST_RATE_LIMIT_STORAGE_URL=redis://redis:6379/15 \
            openscribe sh -c 'python -m pytest -q tests/test_telehealth_*.py'

      - name: Restart runtime on persistent volumes
        run: |
          docker compose --profile runtime down
          docker compose --profile runtime up -d --no-build

      - name: Wait for OpenScribe health after restart
        shell: bash
        run: bash .github/scripts/wait-for-openscribe-health.sh

      - name: Show final container status
        if: always()
        run: |
          docker compose --profile runtime ps -a
          docker compose --profile runtime logs --no-color --tail=100 openscribe || true

      - name: Stop runtime
        if: always()
        run: docker compose --profile runtime down --volumes
