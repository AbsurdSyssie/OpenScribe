<form id="new-session-form" method="post" action="/transcribe/sessions" hidden>
<input type="hidden" name="ingestion_mode" value="{{ preferred_recording_mode or 'whole_file' }}">
</form>

<script nonce="{{ request.state.csp_nonce }}">
(function() {
window.refreshLucideIcons = function(root) {
if (!window.lucide?.createIcons) return;
window.lucide.createIcons(root ? { root: root } : undefined);
};
window.refreshLucideIcons();
var toastContainer = document.querySelector('[data-toast-container]');
window.showToast = function(message, kind, duration) {
if (!toastContainer || !message) return null;
var allowedKinds = ['success', 'info', 'warning', 'error'];
kind = allowedKinds.indexOf(kind) >= 0 ? kind : 'success';
var durations = { success: 2500, info: 4000, warning: 6000, error: 0 };
var timeout = typeof duration === 'number' ? Math.max(0, duration) : durations[kind];
var isMobile = window.matchMedia('(max-width: 767px)').matches;
var activeToasts = Array.prototype.slice.call(toastContainer.querySelectorAll('.toast'));
var activeError = activeToasts.find(function(candidate) { return candidate.classList.contains('error'); });
if (isMobile && activeError && kind !== 'error') return activeError;
if (isMobile || kind === 'error') {
activeToasts.forEach(function(candidate) {
window.clearTimeout(candidate._dismissTimer);
candidate.remove();
});
} else {
while (activeToasts.length >= 3) {
var oldest = activeToasts.shift();
window.clearTimeout(oldest._dismissTimer);
oldest.remove();
}
}
var toast = document.createElement('div');
toast.className = 'toast ' + kind;
toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
toast.setAttribute('aria-live', kind === 'error' ? 'assertive' : 'polite');
toast.setAttribute('aria-atomic', 'true');

var icon = document.createElement('i');
icon.className = 'toast__icon';
icon.setAttribute('aria-hidden', 'true');
icon.setAttribute('data-lucide', {
success: 'circle-check',
info: 'info',
warning: 'triangle-alert',
error: 'circle-alert'
}[kind]);
toast.appendChild(icon);

var messageNode = document.createElement('span');
messageNode.className = 'toast__message';
messageNode.textContent = message;
toast.appendChild(messageNode);

var dismiss = function(immediate) {
if (!toast.isConnected || toast.dataset.dismissing === 'true') return;
toast.dataset.dismissing = 'true';
window.clearTimeout(toast._dismissTimer);
if (immediate) {
toast.remove();
return;
}
toast.classList.add('hiding');
window.setTimeout(function() { toast.remove(); }, 200);
};

if (kind === 'error') {
var close = document.createElement('button');
close.type = 'button';
close.className = 'toast__close';
close.setAttribute('aria-label', 'Dismiss notification');
var closeIcon = document.createElement('i');
closeIcon.setAttribute('data-lucide', 'x');
closeIcon.setAttribute('aria-hidden', 'true');
close.appendChild(closeIcon);
close.addEventListener('click', function() { dismiss(false); });
toast.appendChild(close);
}

toastContainer.appendChild(toast);
window.refreshLucideIcons?.(toast);
if (timeout > 0) toast._dismissTimer = window.setTimeout(function() { dismiss(false); }, timeout);
return toast;
};
var flashWrap = document.querySelector('[data-flash-wrap]');
var flashBanner = document.querySelector('[data-flash]');
function syncQuickActionQuickPicks() {
var quickActionSelect = document.querySelector('[data-quick-action-select]');
var quickActionIdInput = document.querySelector('[data-quick-action-id-input]');
var quickPickButtons = document.querySelectorAll('[data-quick-action-quick-pick]');
var selectedId = quickActionSelect ? quickActionSelect.value : '';
quickPickButtons.forEach(function(button) {
button.setAttribute('aria-pressed', button.getAttribute('data-quick-action-id') === selectedId ? 'true' : 'false');
});
if (quickActionIdInput) {
quickActionIdInput.value = selectedId;
}
}
if (flashWrap && flashBanner) {
var flashKind = flashBanner.classList.contains('error') ? 'error' : 'success';
var flashMessage = (flashBanner.textContent || '').trim();
if (flashMessage) {
showToast(flashMessage, flashKind);
flashWrap.hidden = true;
}
}
syncQuickActionQuickPicks();

document.addEventListener('change', function(e) {
if (e.target && e.target.matches('[data-quick-action-select]')) {
syncQuickActionQuickPicks();
}
});

document.addEventListener('click', function(e) {
var recordModeDropdown = e.target.closest('[data-record-mode-dropdown]');
if (recordModeDropdown) {
e.preventDefault();
e.stopPropagation();
var menu = document.querySelector('[data-record-mode-menu]');
if (menu) {
var isHidden = menu.hasAttribute('hidden');
if (isHidden) {
menu.removeAttribute('hidden');
} else {
menu.setAttribute('hidden', '');
}
recordModeDropdown.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
}
return;
}

var recordModeOption = e.target.closest('[data-mode]');
if (recordModeOption) {
e.preventDefault();
var mode = recordModeOption.getAttribute('data-mode');
var modeSelect = document.querySelector('[data-recording-mode-select]');
var menu = document.querySelector('[data-record-mode-menu]');
var dropdownBtn = document.querySelector('[data-record-mode-dropdown]');
if (modeSelect && mode) {
modeSelect.value = mode;
modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
}
if (menu) menu.hidden = true;
if (dropdownBtn) dropdownBtn.setAttribute('aria-expanded', 'false');
syncRecordButtonLabel();
return;
}

var menu = document.querySelector('[data-record-mode-menu]');
var dropdownBtn = document.querySelector('[data-record-mode-dropdown]');
if (menu && !menu.hidden && !e.target.closest('[data-record-split-button]')) {
menu.hidden = true;
if (dropdownBtn) dropdownBtn.setAttribute('aria-expanded', 'false');
}

var quickPickButton = e.target.closest('[data-quick-action-quick-pick]');
if (quickPickButton) {
e.preventDefault();
if (quickPickButton.disabled) return;
var quickActionSelect = document.querySelector('[data-quick-action-select]');
var quickActionContextInput = document.querySelector('[data-quick-action-context-input]');
if (quickActionSelect) {
quickActionSelect.value = quickPickButton.getAttribute('data-quick-action-id') || '';
syncQuickActionQuickPicks();
}
if (quickActionContextInput) {
quickActionContextInput.focus();
}
return;
}

var runQuickActionButton = e.target.closest('[data-run-quick-action-trigger]');
if (runQuickActionButton) {
e.preventDefault();
return;
}

var generateFollowupButton = e.target.closest('[data-generate-followup-trigger]');
if (generateFollowupButton) {
e.preventDefault();
var promptInput = document.querySelector('[data-quick-action-context-input]');
var promptHidden = document.querySelector('[data-followup-prompt-hidden]');
var generateFollowupForm = document.querySelector('[data-generate-followup-form]');
if (promptInput && promptHidden && generateFollowupForm) {
var promptText = promptInput.value.trim();
if (promptText) {
promptHidden.value = promptText;
generateFollowupForm.submit();
}
}
return;
}

var copyFollowupButton = e.target.closest('[data-copy-followup]');
if (copyFollowupButton) {
e.preventDefault();
e.stopPropagation();
var card = copyFollowupButton.closest('.followup-card');
var content = card ? card.querySelector('.followup-card__content') : null;
var text = content ? content.textContent.trim() : '';
if (text) {
navigator.clipboard.writeText(text).then(function() {
showToast('Copied to clipboard', 'success');
}).catch(function() {
showToast('Could not copy', 'error');
});
}
return;
}
});
function syncRecordButtonLabel() {
var modeSelect = document.querySelector('[data-recording-mode-select]');
var labelEl = document.querySelector('[data-record-toggle-label]');
var options = document.querySelectorAll('[data-record-mode-menu] [data-mode]');
if (!modeSelect || !labelEl) return;
var mode = modeSelect.value;
labelEl.textContent = mode === 'live_chunked' ? 'Start live' : 'Start recording';
options.forEach(function(opt) {
opt.classList.toggle('active', opt.getAttribute('data-mode') === mode);
});
}
syncRecordButtonLabel();
  document.addEventListener('change', function(e) {
    if (e.target && e.target.matches('[data-recording-mode-select]')) {
      syncRecordButtonLabel();
    }
  });

  var sessionPanelToggles = document.querySelectorAll('[data-session-panel-toggle]');
  var sessionPanel = document.querySelector('[data-session-panel]');
  var sessionPanelClose = document.querySelector('[data-session-panel-close]');
  var sessionPanelScrim = document.querySelector('[data-session-panel-scrim]');
  var sessionPanelHeader = document.querySelector('[data-session-panel-header]');
  var workspaceContextHeaders = document.querySelectorAll('[data-workspace-context-header]');
  var workspaceTabPanels = document.querySelectorAll('[data-tab-panel]');
  var primarySidebar = document.querySelector('[data-primary-sidebar]');
  var sidebarResize = document.querySelector('[data-sidebar-resize]');
  var sidebarCollapseToggles = document.querySelectorAll('[data-sidebar-collapse-toggle]');
  var sidebarWidthStorageKey = 'openscribe:transcribe:sidebar-width';
  var sidebarCollapsedWidth = 64;
  var sidebarRestoreWidth = 288;
  var sidebarMinWidth = 192;
  var sidebarMaxWidth = 384;
  var sidebarCollapseThreshold = 112;
  var desktopSidebarMedia = window.matchMedia('(min-width: 768px)');
  var sessionPanelStorageKey = 'openscribe:transcribe:consultations-open';
  var sessionPanelTrigger = null;

  function normalizedSidebarWidth(value) {
    if (!Number.isFinite(value) || value <= sidebarCollapseThreshold) return sidebarCollapsedWidth;
    return Math.min(sidebarMaxWidth, Math.max(sidebarMinWidth, value));
  }
  function storedSidebarWidth() {
    try {
      var value = Number.parseFloat(window.localStorage.getItem(sidebarWidthStorageKey) || '');
      return normalizedSidebarWidth(Number.isFinite(value) ? value : sidebarRestoreWidth);
    } catch (_) {
      return sidebarRestoreWidth;
    }
  }
  function applySidebarWidth(value, persist) {
    if (!primarySidebar || !desktopSidebarMedia.matches) return;
    var width = normalizedSidebarWidth(value);
    var collapsed = width === sidebarCollapsedWidth;
    primarySidebar.style.width = width + 'px';
    primarySidebar.classList.toggle('is-collapsed', collapsed);
    sidebarCollapseToggles.forEach(function(toggle) {
      var label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    });
    if (sidebarResize) sidebarResize.setAttribute('aria-valuenow', String(width));
    if (persist) {
      try {
        window.localStorage.setItem(sidebarWidthStorageKey, String(width));
      } catch (_) {
        // Browser privacy settings can deny localStorage; width still works for this page.
      }
    }
  }
  function syncSidebarViewport() {
    if (!primarySidebar) return;
    if (desktopSidebarMedia.matches) {
      applySidebarWidth(storedSidebarWidth(), false);
      return;
    }
    primarySidebar.style.removeProperty('width');
    primarySidebar.classList.remove('is-collapsed');
  }
  if (primarySidebar && sidebarResize) {
    var activePointerId = null;
    var dragStartX = 0;
    var dragStartWidth = sidebarRestoreWidth;
    function stopSidebarResize() {
      if (activePointerId !== null) sidebarResize.releasePointerCapture?.(activePointerId);
      activePointerId = null;
      primarySidebar.classList.remove('is-resizing');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
    sidebarResize.addEventListener('pointerdown', function(event) {
      if (!desktopSidebarMedia.matches) return;
      activePointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartWidth = primarySidebar.getBoundingClientRect().width;
      primarySidebar.classList.add('is-resizing');
      sidebarResize.setPointerCapture?.(activePointerId);
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      event.preventDefault();
    });
    sidebarResize.addEventListener('pointermove', function(event) {
      if (activePointerId === event.pointerId) applySidebarWidth(dragStartWidth + event.clientX - dragStartX, false);
    });
    sidebarResize.addEventListener('pointerup', function(event) {
      if (activePointerId !== event.pointerId) return;
      applySidebarWidth(primarySidebar.getBoundingClientRect().width, true);
      stopSidebarResize();
    });
    sidebarResize.addEventListener('pointercancel', stopSidebarResize);
    sidebarResize.addEventListener('dblclick', function() {
      var width = primarySidebar.getBoundingClientRect().width;
      applySidebarWidth(width === sidebarCollapsedWidth ? sidebarRestoreWidth : sidebarCollapsedWidth, true);
    });
    sidebarResize.addEventListener('keydown', function(event) {
      if (!desktopSidebarMedia.matches) return;
      var width = primarySidebar.getBoundingClientRect().width;
      if (event.key === 'ArrowLeft') width -= 16;
      else if (event.key === 'ArrowRight') width += 16;
      else if (event.key === 'Home') width = sidebarCollapsedWidth;
      else if (event.key === 'End') width = sidebarMaxWidth;
      else return;
      event.preventDefault();
      applySidebarWidth(width, true);
    });
  }
  sidebarCollapseToggles.forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      if (!desktopSidebarMedia.matches || !primarySidebar) return;
      var width = primarySidebar.getBoundingClientRect().width;
      applySidebarWidth(width === sidebarCollapsedWidth ? sidebarRestoreWidth : sidebarCollapsedWidth, true);
    });
  });
  desktopSidebarMedia.addEventListener('change', syncSidebarViewport);
  syncSidebarViewport();

  function syncSessionPanelHeaderHeight() {
    if (!sessionPanel || !sessionPanelHeader) return;
    if (!desktopSidebarMedia.matches) {
      sessionPanel.style.removeProperty('--workspace-context-header-height');
      return;
    }
    var activeHeader = document.querySelector('[data-tab-panel]:not([hidden]) [data-workspace-context-header]');
    if (!activeHeader) return;
    var headerHeight = activeHeader.getBoundingClientRect().height;
    if (headerHeight <= 0) return;
    sessionPanel.style.setProperty('--workspace-context-header-height', headerHeight + 'px');
  }
  function storedSessionPanelOpen() {
    try {
      return window.localStorage.getItem(sessionPanelStorageKey) === 'true';
    } catch (_) {
      return false;
    }
  }
  function isFocusableSessionPanelToggle(toggle) {
    return Boolean(
      toggle
      && !toggle.disabled
      && !toggle.hidden
      && !toggle.closest('[hidden], [inert]')
      && toggle.getClientRects().length,
    );
  }
  function fallbackSessionPanelTrigger() {
    var mobileHeaderToggle = Array.from(sessionPanelToggles).find(function(toggle) {
      return toggle.closest('.workspace-mobile-header') && isFocusableSessionPanelToggle(toggle);
    });
    return mobileHeaderToggle || Array.from(sessionPanelToggles).find(isFocusableSessionPanelToggle) || null;
  }
  function focusSessionPanelTrigger() {
    (isFocusableSessionPanelToggle(sessionPanelTrigger) ? sessionPanelTrigger : fallbackSessionPanelTrigger())?.focus();
  }
  function setSessionPanelOpen(open, options) {
    if (!sessionPanel || !sessionPanelToggles.length) return;
    options = options || {};
    if (options.withoutAnimation) sessionPanel.style.transition = 'none';
    sessionPanelToggles.forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    sessionPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
    sessionPanel.toggleAttribute('inert', !open);
    sessionPanel.classList.toggle('is-collapsed', !open);
    sessionPanelScrim?.toggleAttribute('hidden', !open || desktopSidebarMedia.matches);
    document.body.classList.toggle('session-panel-open', Boolean(open && !desktopSidebarMedia.matches));
    if (options.persist && desktopSidebarMedia.matches) {
      try {
        window.localStorage.setItem(sessionPanelStorageKey, open ? 'true' : 'false');
      } catch (_) {
        // Browser privacy settings can deny localStorage; panel still works for this page.
      }
    }
    window.refreshLucideIcons?.(open ? sessionPanel : sessionPanelToggles[0]);
    if (open && !desktopSidebarMedia.matches) {
      document.dispatchEvent(new CustomEvent('workspace:drawer-close'));
      sessionPanel.querySelector('[data-session-panel-close]')?.focus();
    }
    if (open) requestAnimationFrame(function() {
      sessionPanel.querySelector('[data-session-list-sentinel]')?.parentElement?.dispatchEvent(new Event('scroll'));
      document.dispatchEvent(new CustomEvent('transcribe:session-panel-opened'));
    });
    if (options.withoutAnimation) requestAnimationFrame(function() {
      sessionPanel.style.removeProperty('transition');
    });
  }
  function syncSessionPanelViewport() {
    syncSessionPanelHeaderHeight();
    setSessionPanelOpen(
      desktopSidebarMedia.matches && storedSessionPanelOpen(),
      { withoutAnimation: true },
    );
  }
  sessionPanelToggles.forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      sessionPanelTrigger = toggle;
      setSessionPanelOpen(toggle.getAttribute('aria-expanded') !== 'true', { persist: true });
    });
  });
  sessionPanelClose?.addEventListener('click', function() {
    setSessionPanelOpen(false, { persist: true });
    focusSessionPanelTrigger();
  });
  sessionPanelScrim?.addEventListener('click', function() {
    setSessionPanelOpen(false, { persist: true });
    focusSessionPanelTrigger();
  });
  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape' || sessionPanelToggles[0]?.getAttribute('aria-expanded') !== 'true') return;
    setSessionPanelOpen(false, { persist: true });
    focusSessionPanelTrigger();
  });
  document.addEventListener('workspace:drawer-opening', function() {
    if (!desktopSidebarMedia.matches && sessionPanelToggles[0]?.getAttribute('aria-expanded') === 'true') {
      setSessionPanelOpen(false);
    }
  });
  document.addEventListener('openscribe:dictation-modal-opening', function() {
    if (!desktopSidebarMedia.matches && sessionPanelToggles[0]?.getAttribute('aria-expanded') === 'true') {
      setSessionPanelOpen(false);
    }
  });
  if ('ResizeObserver' in window) {
    var sessionPanelHeaderObserver = new ResizeObserver(syncSessionPanelHeaderHeight);
    workspaceContextHeaders.forEach(function(header) {
      sessionPanelHeaderObserver.observe(header);
    });
  }
  if ('MutationObserver' in window) {
    var sessionPanelTabObserver = new MutationObserver(function() {
      requestAnimationFrame(syncSessionPanelHeaderHeight);
    });
    workspaceTabPanels.forEach(function(panel) {
      sessionPanelTabObserver.observe(panel, { attributes: true, attributeFilter: ['hidden'] });
    });
  }
  window.addEventListener('resize', syncSessionPanelHeaderHeight);
  document.fonts?.ready.then(syncSessionPanelHeaderHeight);
  desktopSidebarMedia.addEventListener('change', syncSessionPanelViewport);
  syncSessionPanelViewport();
})();
</script>

<div class="tour-overlay" data-tour-overlay hidden>
    <div class="tour-overlay__scrim-panel" data-tour-scrim="top" data-tour-close></div>
    <div class="tour-overlay__scrim-panel" data-tour-scrim="right" data-tour-close></div>
    <div class="tour-overlay__scrim-panel" data-tour-scrim="bottom" data-tour-close></div>

      <div class="tour-overlay__eyebrow">Quick guide</div>

          <button type="button" class="btn-secondary" data-tour-close-button>Close</button>

        </div>
      </div>

  <script id="transcribe-bootstrap" type="application/json" nonce="{{ request.state.csp_nonce }}">
    {{ {
      "activeTranscriptId": active_transcript_id,
      "activeIngestionMode": active_transcript.ingestion_mode.value if active_transcript else none,
      "activeTranscriptHasContent": active_transcript.has_transcript_content if active_transcript else false,
      "latestSuccessfulIngestionCompletedAt": active_transcript.latest_successful_ingestion_completed_at.isoformat() if active_transcript and active_transcript.latest_successful_ingestion_completed_at else none,
      "nextLiveChunkSequenceNo": active_transcript_next_live_chunk_sequence_no_upload if active_transcript_next_live_chunk_sequence_no_upload is not none else 1,
      "hasSttSelection": stt_selection is not none,
      "hasDictationSttSelection": dictation_stt_selected,
      "hasLlmSelection": llm_selection is not none,
      "sttAvailable": stt_available,
      "sttHealth": stt_health,
      "dictationSttAvailable": dictation_stt_available,
      "sttStatusMessage": stt_status_message,
      "dictationSttStatusMessage": dictation_stt_status_message,
      "latestIngestionJobStatus": active_transcript_latest_job.status.value if active_transcript_latest_job else none,
      "latestIngestionErrorMessage": active_transcript_latest_job.error_message if active_transcript_latest_job else none,
      "showRedactionDebug": show_redaction_debug,
      "initialTranscriptErrorMessage": active_transcript_latest_job.error_message if active_transcript_latest_job else none,
      "emisSections": structured_section_definitions,
      "activeTranscriptPiiEntities": active_transcript_pii_entities,
      "activeTranscriptRedactionStatus": active_transcript_redaction_status,
      "activeTranscriptClinicalNlpStatus": active_transcript_clinical_nlp_status,
      "activeWorkingNote": active_working_note,
      "activeTab": 'followups' if active_tab == 'followups' else 'output',
      "viewerRole": 'leader' if current_user.team_role and current_user.team_role.value == 'leader' else 'user',
      "userAppPreferences": user_app_preferences_json,
      "smartPhrases": smart_phrases if smart_phrases is defined else []
    } | tojson }}
  </script>
