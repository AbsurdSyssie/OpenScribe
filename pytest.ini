[pytest]
pythonpath = .
markers =
    migration: tests that exercise Alembic migrations directly
filterwarnings =
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:starlette.formparsers
    ignore:jsonschema\.exceptions\.RefResolutionError is deprecated.*:DeprecationWarning:prance
    ignore:validate_spec shortcut is deprecated\. Use validate instead\.:DeprecationWarning:openapi_spec_validator.shortcuts
