<script>
  (() => {
    const COOKIE_NAME = "openscribe_csrf";

    function readCookie(name) {
      const prefix = `${name}=`;
      for (const part of document.cookie.split(";")) {
        const trimmed = part.trim();
        if (trimmed.startsWith(prefix)) {
          return decodeURIComponent(trimmed.slice(prefix.length));
        }
      }
      return "";
    }

    function applyCsrfToken() {
      const token = readCookie(COOKIE_NAME);
      if (!token) {
        return;
      }
      document.querySelectorAll('form[method="post"], form[method="POST"]').forEach((form) => {
        let input = form.querySelector('input[name="_csrf_token"]');
        if (!input) {
          input = document.createElement("input");
          input.type = "hidden";
          input.name = "_csrf_token";
          form.appendChild(input);
        }
        input.value = token;
      });
      window.OpenScribeCSRF = {
        ...(window.OpenScribeCSRF || {}),
        getToken() {
          return readCookie(COOKIE_NAME);
        },
      };
    }

    function csrfHeaders(existingHeaders) {
      const headers = new Headers(existingHeaders || {});
      const token = readCookie(COOKIE_NAME);
      if (token) {
        headers.set("X-CSRF-Token", token);
      }
      return headers;
    }

    function isUnsafeApiRequest(input, init) {
      const method = String(init?.method || (input instanceof Request ? input.method : "GET") || "GET").toUpperCase();
      if (!["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
        return false;
      }
      const rawUrl = input instanceof Request ? input.url : String(input || "");
      const url = new URL(rawUrl, window.location.href);
      return url.origin === window.location.origin && url.pathname.startsWith("/api/v1/");
    }

    function installFetchCsrf() {
      if (window.OpenScribeCSRF?.fetchInstalled) {
        return;
      }
      const originalFetch = window.fetch.bind(window);
      const csrfFetch = (input, init = {}) => {
        if (!isUnsafeApiRequest(input, init)) {
          return originalFetch(input, init);
        }
        return originalFetch(input, {
          ...init,
          headers: csrfHeaders(init.headers || (input instanceof Request ? input.headers : undefined)),
        });
      };
      window.fetch = csrfFetch;
      window.OpenScribeCSRF = {
        ...(window.OpenScribeCSRF || {}),
        fetchInstalled: true,
        fetch: csrfFetch,
        getToken() {
          return readCookie(COOKIE_NAME);
        },
      };
    }

    installFetchCsrf();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", applyCsrfToken, { once: true });
    } else {
      applyCsrfToken();
    }
  })();
</script>
