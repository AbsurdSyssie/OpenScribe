<script nonce="{{ request.state.csp_nonce }}">
  (() => {
    const CSRF_TOKEN = "{{ request.state.csrf_token }}";

    function currentToken() {
      return CSRF_TOKEN;
    }

    function applyCsrfToken() {
      const token = currentToken();
      if (!token) {
        return;
      }
      document.querySelectorAll('form[method="post"], form[method="POST"]').forEach((form) => {
        let input = form.querySelector('input[name="_csrf_token"]');
        if (!input) {
          input = document.createElement("input");
          input.type = "hidden";
          input.name = "_csrf_token";
          form.appendChild(input);
        }
        input.value = token;
      });
      window.OpenScribeCSRF = {
        ...(window.OpenScribeCSRF || {}),
        getToken() {
          return currentToken();
        },
      };
    }

    function csrfHeaders(existingHeaders) {
      const headers = new Headers(existingHeaders || {});
      const token = currentToken();
      if (token) {
        headers.set("X-CSRF-Token", token);
      }
      return headers;
    }

    function isUnsafeApiRequest(input, init) {
      const method = String(init?.method || (input instanceof Request ? input.method : "GET") || "GET").toUpperCase();
      if (!["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
        return false;
      }
      const rawUrl = input instanceof Request ? input.url : String(input || "");
      const url = new URL(rawUrl, window.location.href);
      return url.origin === window.location.origin && url.pathname.startsWith("/api/v1/");
    }

    function installFetchCsrf() {
      if (window.OpenScribeCSRF?.fetchInstalled) {
        return;
      }
      const originalFetch = window.fetch.bind(window);
      {% if current_user %}
      let checkingSession = false;
      let loginRedirectRequested = false;
      async function checkSession() {
        if (checkingSession || loginRedirectRequested || document.visibilityState !== "visible") {
          return;
        }
        checkingSession = true;
        try {
          const response = await originalFetch("/api/v1/auth/me", {
            cache: "no-store",
            credentials: "same-origin",
            redirect: "error",
          });
          if (response.status === 401 && document.visibilityState === "visible") {
            loginRedirectRequested = true;
            window.location.replace("/login");
          }
        } catch {
          // A connection failure cannot establish that the session has ended.
        } finally {
          checkingSession = false;
        }
      }

      window.addEventListener("focus", checkSession);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          // Allow the next visit to retry if a leave-page prompt was dismissed.
          loginRedirectRequested = false;
        } else {
          void checkSession();
        }
      });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          loginRedirectRequested = false;
          void checkSession();
        }
      });
      {% endif %}
      const csrfFetch = (input, init = {}) => {
        const requestInit = isUnsafeApiRequest(input, init) ? {
          ...init,
          headers: csrfHeaders(init.headers || (input instanceof Request ? input.headers : undefined)),
        } : init;
        const request = originalFetch(input, requestInit);
        {% if current_user %}
        return request.then((response) => {
          const denied = response.status === 401 || response.status === 403;
          if (response.url && (denied || response.redirected)) {
            const url = new URL(response.url);
            if (url.origin === window.location.origin && (denied || url.pathname === "/login")) {
              void checkSession();
            }
          }
          return response;
        });
        {% else %}
        return request;
        {% endif %}
      };
      window.fetch = csrfFetch;
      window.OpenScribeCSRF = {
        ...(window.OpenScribeCSRF || {}),
        fetchInstalled: true,
        fetch: csrfFetch,
        getToken() {
          return currentToken();
        },
      };
    }

    installFetchCsrf();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", applyCsrfToken, { once: true });
    } else {
      applyCsrfToken();
    }
  })();
</script>
