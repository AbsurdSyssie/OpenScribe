nlp:
  model_name: en_core_web_sm

custom_recognizers:
  - entity_name: UK_NHS_NUMBER
    regex: "\\b(?:\\d{3}\\s?\\d{3}\\s?\\d{4})\\b"
    score: 0.9
  - entity_name: UK_DRIVER_LICENSE
    regex: "\\b[A-Z]{2}\\d{6}[A-Z]\\b"
    score: 0.9
  - entity_name: UK_POSTCODE
    regex: "\\b[A-Z]{1,2}\\d{1,2}[A-Z]?\\s?\\d[A-Z]{2}\\b"
    score: 0.7
  - entity_name: STREET_ADDRESS_PHRASE
    regex: "\\b([A-Z][a-z]+(?:[-'][A-Z][a-z]+)?(?:\\s+[A-Z][a-z]+(?:[-'][A-Z][a-z]+)?){0,4})\\s(road|rd|street|avenue|lane|ln|close|way|drive|crescent|cres|place|pl|court|ct|terrace|ter|square|sq|grove|row)\\b"
    score: 0.6
