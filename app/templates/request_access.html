<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Access</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fffaf0;
      --ink: #1b1d1f;
      --muted: #5b605f;
      --line: #d4c7ab;
      --accent: #9f3a2d;
      --accent-strong: #7f251b;
      --success: #316b4d;
      --error: #9a2e2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      background: linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
      color: var(--ink);
    }
    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      display: grid;
      gap: 16px;
      box-shadow: 0 18px 60px rgba(76, 54, 30, 0.08);
    }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); }
    input, textarea {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button, a {
      width: fit-content;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      background: var(--accent);
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, a:hover { background: var(--accent-strong); }
    .flash { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; }
    .flash.success { color: var(--success); }
    .flash.error { color: var(--error); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <div>OpenScribe access requests</div>
    <h1>Request an account</h1>
    <p>Submit your details and the team you belong to. A system admin or matching team leader can review the request and create your real account manually.</p>
    {% if message %}
    <div class="flash {{ message_kind }}">{{ message }}</div>
    {% endif %}
    <form method="post" action="/request-access">
      <label>
        Name
        <input type="text" name="requested_name" maxlength="255" required>
      </label>
      <label>
        Email
        <input type="email" name="requested_email" required>
      </label>
      <label>
        Team name
        <input type="text" name="requested_team_name" maxlength="255" required>
      </label>
      <label>
        Details
        <textarea name="request_details" maxlength="2000" placeholder="Context for the reviewer"></textarea>
      </label>
      <div class="actions">
        <button type="submit">Submit request</button>
        <a href="/login">Back to login</a>
      </div>
    </form>
  </main>
  {% include "_csrf_script.html" %}
</body>
</html>
