    <aside class="transcribe-sidebar w-72 bg-parchment border-r border-stone flex flex-col flex-shrink-0 min-h-0 relative z-10" data-primary-sidebar>
      <div class="p-5 border-b border-stone">
        <div class="flex items-center gap-3">
          <a class="brand transcribe-sidebar__brand" href="#top" aria-label="OpenScribe home">
            <span class="brand-mark" aria-hidden="true"><i data-lucide="feather"></i></span>
            <span class="brand-name" data-sidebar-full>OpenScribe</span>
          </a>
        </div>
        <button
          type="button"
          class="transcribe-sidebar-collapse-toggle"
          data-sidebar-collapse-toggle
          data-sidebar-collapsed-control
          aria-label="Expand sidebar"
          title="Expand sidebar">
          <i class="w-4 h-4" data-lucide="panel-left-open" aria-hidden="true"></i>
        </button>
      </div>

      <div class="px-4 pb-2 border-b border-stone/70" data-sidebar-full>
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium text-ink truncate">{{ current_user.full_name or current_user.email }}</div>
            <div class="text-xs text-slate truncate">{{ current_user.email }}</div>
          </div>
          <button
            type="button"
            class="transcribe-sidebar-collapse-toggle"
            data-sidebar-collapse-toggle
            aria-label="Collapse sidebar"
            title="Collapse sidebar">
            <i class="w-4 h-4" data-lucide="panel-left-close" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="p-4 space-y-3">
        <div class="space-y-2">
          <button
            type="submit"
            form="new-session-form"
            class="w-full bg-teal-deep text-white rounded-lg px-4 py-3 font-medium text-sm shadow-sm hover:bg-teal-muted transition flex items-center justify-between gap-3 text-left"
            data-new-session-button
            data-local-busy-protected
            data-tour-target="new-session"
            aria-label="Create new consultation"
            title="Create new consultation">
            <span class="flex items-center gap-2">
              <i class="w-4 h-4 flex-shrink-0" data-lucide="plus"></i>
              <span data-sidebar-full>Create new consultation</span>
            </span>
          </button>
        </div>
        <div class="flex items-center">
          <button
            type="button"
            class="flex items-center gap-1.5 text-xs font-medium text-slate uppercase tracking-wider hover:text-ink transition rounded px-1.5 py-1 -ml-1.5"
            data-session-panel-toggle
            data-tour-target="session-list"
            aria-expanded="false"
            aria-label="Recent consultations"
            title="Recent consultations">
            <span data-sidebar-full>Recent consultations</span>
            <i class="w-4 h-4 flex-shrink-0" data-lucide="chevron-right" data-toggle-icon data-sidebar-full></i>
            <i class="w-4 h-4 flex-shrink-0" data-lucide="list-checks" data-sidebar-collapsed-icon aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <form id="bulk-delete-sessions" class="hidden" method="post" action="/transcribe/sessions/delete">
      </form>

      <div class="flex-1"></div>

      <div class="p-4 border-t border-stone bg-parchment/80 space-y-2">
      </div>
    </aside>
    <button
      type="button"
      class="transcribe-sidebar-resize"
      data-sidebar-resize
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize consultation sidebar"
      aria-valuemin="64"
      aria-valuemax="384"
      aria-valuenow="288"
      title="Drag to resize. Double-click to collapse or restore.">
    </button>
