<div class="tour-overlay workspace-guide-overlay" data-tour-overlay hidden aria-hidden="true">
  <div class="tour-overlay__scrim-panel" data-tour-scrim="top" data-tour-close></div>
  <div class="tour-overlay__scrim-panel" data-tour-scrim="right" data-tour-close></div>
  <div class="tour-overlay__scrim-panel" data-tour-scrim="bottom" data-tour-close></div>
  <div class="tour-overlay__scrim-panel" data-tour-scrim="left" data-tour-close></div>
  <div class="tour-overlay__highlight" data-tour-highlight></div>
  <div class="tour-overlay__card" data-tour-card>
    <div class="tour-overlay__eyebrow">Page guide</div>
    <div class="tour-overlay__title" data-tour-title></div>
    <div class="tour-overlay__body" data-tour-body></div>
    <div class="tour-overlay__actions">
      <div class="tour-overlay__progress" data-tour-progress></div>
      <div class="tour-overlay__buttons">
        <button type="button" class="btn-secondary" data-tour-back>Back</button>
        <button type="button" class="btn-secondary" data-tour-close-button>Close</button>
        <button type="button" class="btn-primary" data-tour-next>Next</button>
      </div>
    </div>
  </div>
</div>
