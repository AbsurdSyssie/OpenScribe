version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ambient_scribe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambient_scribe
      POSTGRES_USER: ambient
      POSTGRES_PASSWORD: ambient
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ambient_scribe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  vault:
    image: hashicorp/vault:1.17
    container_name: ambient_scribe_vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    command: vault server -dev

volumes:
  postgres_data:
