<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Generating Indicator</title>

<style>
:root{
  --teal:#2d5b63;
  --teal-soft:rgba(45,91,99,.12);
  --text:#1f2937;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  display:grid;
  place-items:center;
  background:#faf9f7;
  font-family:Inter,system-ui,sans-serif;
}

.card{
  width:420px;
  padding:56px 48px;
  background:white;
  border:1px solid rgba(0,0,0,.05);
  border-radius:24px;
  text-align:center;
  box-shadow:
    0 10px 30px rgba(0,0,0,.04);
}

.loading-orbit{
  --ring:72px;
  --dot:10px;

  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 28px;
  display:grid;
  place-items:center;
}

.orbit-ring{
  position:absolute;
  width:var(--ring);
  height:var(--ring);
  border-radius:50%;
  border:1.5px solid var(--teal-soft);
}

.orbit-dot-wrap{
  position:absolute;
  width:var(--ring);
  height:var(--ring);
  animation:orbit 2.2s linear infinite;
}

.orbit-dot{
  position:absolute;
  left:100%;
  top:50%;
  width:var(--dot);
  height:var(--dot);
  border-radius:50%;
  background:var(--teal);

  transform:translate(-50%,-50%);

  box-shadow:
    0 0 0 4px rgba(45,91,99,.08),
    0 2px 8px rgba(45,91,99,.18);
}

.star{
  position:absolute;
  font-size:24px;
  color:var(--teal);
  animation:pulse 1.8s ease-in-out infinite;
}

h2{
  margin:0 0 8px;
  font-size:26px;
  font-weight:600;
  color:var(--text);
}

p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

@keyframes orbit{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    opacity:.75;
  }

  50%{
    transform:scale(1.15);
    opacity:1;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="loading-orbit">
    <div class="orbit-ring"></div>

    <div class="orbit-dot-wrap">
      <div class="orbit-dot"></div>
    </div>

    <div class="star">✦</div>
  </div>

  <h2>Generating your note</h2>

  <p>
    This usually takes a few seconds.<br>
    We're preparing your clinical note...
  </p>

</div>

</body>
</html>
