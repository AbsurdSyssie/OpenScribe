name: Docker runtime smoke test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - .github/workflows/docker-smoke.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-compose.adc.yml
      - docker/**
      - requirements.txt
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - .github/workflows/docker-smoke.yml

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --profile runtime config --quiet

      - name: Build runtime image
        run: docker compose --profile runtime build --quiet

      - name: Start runtime
        run: docker compose --profile runtime up -d --no-build

      - name: Wait for OpenScribe health
        shell: bash
        run: |
          container_id="$(docker compose --profile runtime ps -q openscribe)"

          diagnose() {
            echo "--- compose status ---"
            docker compose --profile runtime ps -a
            echo "--- OpenScribe state ---"
            docker inspect --format '{{json .State}}' "$container_id" || true
            echo "--- OpenScribe logs ---"
            docker compose --profile runtime logs --no-color --tail=200 openscribe || true
          }

          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo missing)"
            if [[ "$status" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:8080/health
              exit 0
            fi
            if [[ "$status" == "unhealthy" || "$status" == "missing" ]]; then
              echo "OpenScribe health status: ${status}" >&2
              diagnose
              exit 1
            fi
            sleep 5
          done

          echo "OpenScribe did not become healthy in time" >&2
          diagnose
          exit 1

      - name: Show final container status
        if: always()
        run: |
          docker compose --profile runtime ps -a
          docker compose --profile runtime logs --no-color --tail=100 openscribe || true

      - name: Stop runtime
        if: always()
        run: docker compose --profile runtime down --volumes
