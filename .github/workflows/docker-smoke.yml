name: Docker runtime smoke test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - requirements.txt
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - .github/workflows/docker-smoke.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - requirements.txt
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/**
      - .github/workflows/docker-smoke.yml

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --profile runtime config

      - name: Build and start runtime
        run: docker compose --profile runtime up -d --build

      - name: Wait for OpenScribe health
        shell: bash
        run: |
          container_id="$(docker compose --profile runtime ps -q openscribe)"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:8080/health
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              echo "OpenScribe became unhealthy" >&2
              exit 1
            fi
            sleep 5
          done
          echo "OpenScribe did not become healthy in time" >&2
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose --profile runtime logs --no-color

      - name: Stop runtime
        if: always()
        run: docker compose --profile runtime down --volumes
