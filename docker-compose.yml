services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambient_scribe
      POSTGRES_USER: ambient
      POSTGRES_PASSWORD: ambient
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./docker/vault/local.hcl:/vault/config/local.hcl:ro
      - vault_data:/vault/file
    command: vault server -config=/vault/config/local.hcl

volumes:
  postgres_data:
  vault_data:
