<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenScribe MFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#FAF8F5; --parchment:#F5F1EB; --card:#FFFFFF; --ink:#1A202C; --slate:#2D3748; --muted:#718096;
      --border:#E2DED6; --accent:#1D4F5E; --accent-soft:#3D7A8C; --accent-pale:#E0F2F5; --error:#C53030;
      --shadow-soft:0 10px 30px rgba(26,32,44,.04); --shadow-focus:0 0 0 3px rgba(224,242,245,.9);
    }
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--bg);position:relative;line-height:1.5}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");opacity:.018}
    main{position:relative;z-index:1;width:min(720px,100%);display:grid;gap:20px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow-soft)}
    .hero{background:linear-gradient(180deg, rgba(245,241,235,.95) 0%, rgba(255,255,255,.98) 100%)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;width:fit-content;margin-bottom:10px;padding:6px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.78);border:1px solid rgba(226,222,214,.92)}
    .eyebrow::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--accent)}
    h1,h2{margin:0;font-family:"Fraunces",serif;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
    h1{font-size:clamp(2rem,4vw,2.7rem);line-height:1.04} p{margin:0;color:var(--muted)}
    form{display:grid;gap:14px} label{display:grid;gap:7px;color:var(--slate);font-size:.95rem;font-weight:500}
    .inline-check{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted)}
    input{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--parchment);transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease}
    input:focus{outline:none;border-color:rgba(61,122,140,.55);background:#fff;box-shadow:var(--shadow-focus)} input[type=checkbox]{width:auto;accent-color:var(--accent);margin-top:2px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    button{width:fit-content;border:1px solid transparent;border-radius:10px;padding:11px 16px;font:inherit;font-weight:500;background:var(--accent);color:#fff;cursor:pointer;transition:all .15s ease;min-height:44px}
    button:hover{background:var(--accent-soft);transform:translateY(-1px)}
    .secondary{background:#fff;color:var(--ink);border-color:var(--border)} .secondary:hover{background:rgba(29,79,94,.04);border-color:rgba(61,122,140,.28)}
    .flash{padding:14px 16px;border-radius:12px;border:1px solid rgba(197,48,48,.2);color:var(--error);background:rgba(197,48,48,.06)}
    .toast-container{position:fixed;top:24px;right:24px;z-index:120;display:flex;flex-direction:column;gap:10px;pointer-events:none}.toast{pointer-events:auto;padding:12px 16px;border-radius:12px;border:1px solid rgba(197,48,48,.2);color:var(--error);background:#fff3f1;font-size:.9rem;font-weight:500;box-shadow:0 18px 32px rgba(15,23,42,.12);animation:toastSlideIn .25s ease;max-width:360px}@keyframes toastSlideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@keyframes toastSlideOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}.toast.hiding{animation:toastSlideOut .2s ease forwards}
    .meta{padding-top:14px;border-top:1px solid rgba(226,222,214,.9);font-size:.92rem;color:var(--muted)}
    @media (max-width:760px){body{padding:18px}.panel{padding:22px}button{width:100%}}
  </style>
</head>
<body>
  <main>
    <section class="panel hero">
      <div class="eyebrow">Additional verification</div>
      <h1>Enter your TOTP code.</h1>
      <p>This login needs multi-factor verification before normal access is granted.</p>
      <div class="meta">Signed in as {{ current_user.email }}</div>
    </section>

    <section class="panel">
      {% if message %}
      <div class="flash">{{ message }}</div>
      {% endif %}

      <form method="post" action="/mfa/challenge">
        <label>
          6-digit TOTP code
          <input type="text" name="code" required minlength="6" maxlength="8" inputmode="numeric" autocomplete="one-time-code">
        </label>
        <label class="inline-check">
          <input type="checkbox" name="remember_device" value="true">
          <span>Remember this browser for 24 hours</span>
        </label>
        <div class="actions">
          <button type="submit">Verify and continue</button>
        </div>
      </form>

      <form method="post" action="/logout">
        <button class="secondary" type="submit">Sign out</button>
      </form>
    </section>
  <div class="toast-container" data-toast-container></div>
  <script>
    (() => {
      const toastContainer = document.querySelector('[data-toast-container]');
      if (!toastContainer) return;
      document.querySelectorAll('.flash').forEach((flash) => {
        const message = flash.textContent.trim();
        if (!message) return;
        const toast = document.createElement('div');
        toast.className = 'toast error';
        toast.textContent = message;
        toastContainer.appendChild(toast);
        window.setTimeout(() => {
          toast.classList.add('hiding');
          window.setTimeout(() => toast.remove(), 200);
        }, 4000);
        flash.hidden = true;
      });
    })();
  </script>
  {% include "_csrf_script.html" %}
  </main>
</body>
</html>
